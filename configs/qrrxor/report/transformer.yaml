# qRRXOR ROBUST multi-seed (transformer) — report seeds at the HP-SEARCH winner: lr=3e-4, batch=64.
# The search (dev seeds 7/11/13) found lr=3e-4/bs64 most robust (3/3 converged, worst-seed belief
# R²=0.974) vs the submission's fragile lr=1e-4/bs16. Full 20k, muP hero arch, report seeds.
sweep_id: qrrxor_robust_transformer

global_config:
  output_dir: "./results"
  device: cuda
  parallel: true
  wandb: false
  wandb_project: "quantum_transformer"
  process_dir: "./process_data"
  val_every: 1
  scheduler: true
  save_every: 100
  compile: true

train_config:
  batches_per_epoch: 20
  bos: false
  n_epochs: 20000

model_config:
  n_ctx: 10
  act_fn: "relu"
  normalization_type: "LN"
  attn_only: false
  dtype: float32
  init_mode: "gpt2"
  init_weights: true
  initializer_range: 0.1

mup_config:
  enabled: true
  base_width: 64
  init_range: 0.1
  input_init_std: 1.0
  zero_init_readout: true
  attn_scale_mode: mup

sweep_config:
  train_config:
    learning_rate:
      - 3.0e-4
    batch_size:
      - 64
  model_config:
    seed:
      - 42
      - 123
      - 456
      - 789
      - 1000
    d_head:
      - 16
    n_layers:
      - 4
    n_heads:
      - 4
  process_config:
    - name: "quantum_rrxor"
      phi: 1.5707963267948966   # pi/2
      theta: 0.7853981633974483 # pi/4
      epsilon: 0.02
