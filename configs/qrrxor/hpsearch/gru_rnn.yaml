# qRRXOR robust-hyperparameter SEARCH (GRU + vanilla RNN) — screen phase, 6k-epoch budget.
# The "after" step: transformer+LSTM search found lr=3e-4/bs64 robust; this checks whether that
# (or another config) is robust for GRU/RNN too. Same LR x batch grid on DEV seeds {7,11,13}.
# rnn_type + seed are sweep-only (base values would be clobbered by launcher cfg.update).
sweep_id: hpsearch_qrrxor_grurnn

global_config:
  output_dir: "./results"
  device: cuda
  parallel: true
  wandb: false
  wandb_project: "quantum_rnn_experiments"
  process_dir: "./process_data"
  val_every: 1
  scheduler: true
  save_every: 100

train_config:
  batches_per_epoch: 20
  bos: false
  n_epochs: 6000

model_config:
  n_ctx: 10
  hidden_size: 64
  num_layers: 4
  dropout: 0.0
  bidirectional: false
  init_scheme: default
  dtype: float32

sweep_config:
  train_config:
    learning_rate:
      - 3.0e-5
      - 1.0e-4
      - 3.0e-4
      - 1.0e-3
    batch_size:
      - 16
      - 64
  model_config:
    rnn_type:
      - "GRU"
      - "RNN"
    seed:
      - 7
      - 11
      - 13
  process_config:
    - name: "quantum_rrxor"
      phi: 1.5707963267948966   # pi/2
      theta: 0.7853981633974483 # pi/4
      epsilon: 0.02
