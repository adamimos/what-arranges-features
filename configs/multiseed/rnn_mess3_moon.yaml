# Stage 2 multi-seed (RNN) — Mess3 + Moon(post_quantum) × {LSTM,GRU,RNN} × seeds {0,1,2,3,42}
# Source of truth: configs/seed42/rnn.yaml (200x128, scheduler true). FRDN split into its
# own config so it runs last / is cleanly cancellable. 2 proc x 3 arch x 5 seed = 30 runs.
# seed ONLY in sweep_config (base seed would be clobbered by launcher cfg.update).
sweep_id: multiseed_stage2_rnn

global_config:
  output_dir: "./results"
  device: cuda
  parallel: true
  wandb: false
  wandb_project: "quantum_rnn_experiments"
  process_dir: "./process_data"
  val_every: 1
  scheduler: true
  save_every: 100

train_config:
  batches_per_epoch: 200
  bos: false
  n_epochs: 20000
  batch_size: 128
  learning_rate: 1.0e-4

model_config:
  n_ctx: 8
  dropout: 0.0
  bidirectional: false
  dtype: float32

sweep_config:
  model_config:
    hidden_size:
      - 64
    num_layers:
      - 4
    rnn_type:
      - "LSTM"
      - "GRU"
      - "RNN"
    seed:
      - 0
      - 1
      - 2
      - 3
      - 42
  train_config:
    learning_rate:
      - 1.0e-4
  process_config:
    - name: "mess3"
      x: 0.05
      a: 0.85
    - name: "post_quantum"    # Moon
      alpha: 2.718281828459045
      beta: 0.5
