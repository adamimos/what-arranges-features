# qRRXOR ROBUST multi-seed (GRU) — report seeds at the GRU search winner: lr=3e-4, batch=64.
# Search (dev seeds 7/11/13): GRU robust at lr=3e-4/bs64 (3/3, worst-seed belief R²=0.997) — same
# as transformer/LSTM winner. Full 20k, report seeds.
sweep_id: qrrxor_robust_gru

global_config:
  output_dir: "./results"
  device: cuda
  parallel: true
  wandb: false
  wandb_project: "quantum_rnn_experiments"
  process_dir: "./process_data"
  val_every: 1
  scheduler: true
  save_every: 100

train_config:
  batches_per_epoch: 20
  bos: false
  n_epochs: 20000

model_config:
  n_ctx: 10
  hidden_size: 64
  num_layers: 4
  rnn_type: "GRU"
  dropout: 0.0
  bidirectional: false
  init_scheme: default
  dtype: float32

sweep_config:
  train_config:
    learning_rate:
      - 3.0e-4
    batch_size:
      - 64
  model_config:
    seed:
      - 42
      - 123
      - 456
      - 789
      - 1000
  process_config:
    - name: "quantum_rrxor"
      phi: 1.5707963267948966   # pi/2
      theta: 0.7853981633974483 # pi/4
      epsilon: 0.02
