# qRRXOR transformer, submission hyperparameters (muP, lr=1e-4, batch=16), seeds 42/123/456. Fig. 4 (i,j) uses seed 123 (run_1).
# Exact config of results/20260424220339 (copied from its sweep_config.yaml). Launch with scripts/launcher_cuda_parallel.py.
sweep_id: 20260424220339

global_config:
  device: cuda
  output_dir: ./results
  parallel: true
  process_dir: ./process_data
  save_every: 100
  scheduler: true
  val_every: 1
  wandb: false   # was true for the original run; W&B logging only, no effect on training
  wandb_project: quantum_transformer
model_config:
  act_fn: relu
  attn_only: false
  dtype: float32
  init_mode: gpt2
  init_weights: true
  initializer_range: 0.1
  n_ctx: 10
  normalization_type: LN
mup_config:
  attn_scale_mode: mup
  base_width: 64
  enabled: true
  init_range: 0.1
  input_init_std: 1.0
  zero_init_readout: true
sweep_config:
  model_config:
    d_head:
    - 16
    n_heads:
    - 4
    n_layers:
    - 4
    seed:
    - 42
    - 123
    - 456
  process_config:
  - epsilon: 0.02
    name: quantum_rrxor
    phi: 1.5707963267948966
    theta: 0.7853981633974483
  train_config:
    batch_size:
    - 16
    learning_rate:
    - 0.0001
train_config:
  batches_per_epoch: 20
  bos: false
  n_epochs: 20000
